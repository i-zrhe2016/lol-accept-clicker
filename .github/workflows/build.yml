name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyautogui pillow rapidocr-onnxruntime numpy pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --console --name "lol-accept"
          --hidden-import=rapidocr_onnxruntime
          --hidden-import=onnxruntime
          --collect-all rapidocr_onnxruntime
          --collect-all onnxruntime
          accept_clicker.py

      - name: Get short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha }}
          name: "Build ${{ steps.vars.outputs.sha }}"
          files: dist/lol-accept.exe
